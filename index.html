<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>URP 워크스페이스 — 새 주소로 이동합니다</title>
<meta name="robots" content="noindex">
<script>
(function(){
  var NEW="https://youareprofessor.github.io/urp-workspace/";
  try{
    // 이 브라우저에 남아 있는 옛 워크스페이스 데이터(ws:*)를 새 주소로 들고 이사
    var data={};
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k&&k.indexOf('ws:')===0)data[k]=localStorage.getItem(k);
    }
    var h=location.hash||'';
    if(Object.keys(data).length){
      var enc=encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(data)))));
      if(enc.length<1500000)h='#wsdata='+enc;
    }
    location.replace(NEW+location.search+h);
  }catch(e){location.replace(NEW);}
})();
</script>
</head><body style="font-family:sans-serif;padding:2rem">
<p>워크스페이스 주소가 <b>youareprofessor.github.io/urp-workspace</b>로 바뀌었어요.<br>
자동으로 이동하지 않으면 <a href="https://youareprofessor.github.io/urp-workspace/">여기를 눌러주세요</a>.</p>
</body></html>
